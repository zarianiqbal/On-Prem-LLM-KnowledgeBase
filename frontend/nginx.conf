# Production web server for the built SPA.
#
# Serves the static Vite build and proxies /api/* to the backend container, so
# the whole app is one origin (no CORS in production). The backend service is
# reachable as "backend" on the docker-compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads up to the app's limit (MAX_UPLOAD_MB, default 25).
    # nginx defaults to 1 MB, which would reject larger files before the backend
    # ever sees them.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream token-by-token — disable buffering so they flush
        # to the browser live instead of arriving all at once.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: client-side routes (/admin, /login, …) should serve the app
    # shell rather than 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
