# Production stack: Postgres (pgvector) + backend API + frontend (nginx serving
# the built SPA and proxying /api to the backend).
#
# Secrets come from .env.production (gitignored). Copy the template and fill it
# in, then start with --env-file so compose can also read it for interpolation:
#
#   cp .env.production.example .env.production   # then edit the values
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# ENVIRONMENT=production and DEV_AUTH_ENABLED=false are forced here, so the
# backend's startup safety guard engages (it refuses to boot with a default
# JWT_SECRET or dev-login enabled).
#
# Ollama is NOT containerized — run it on the host for GPU access (ollama serve),
# or set LLM_PROVIDER=mock in .env.production to run without it.
# For real HTTPS, put a TLS-terminating reverse proxy (e.g. Caddy) in front of
# the frontend — not included here.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: knowledge_base
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb_user -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    # App secrets (JWT_SECRET, GOOGLE_*, ADMIN_EMAILS, …) are injected from this
    # file into the container environment.
    env_file: .env.production
    environment:
      # These override anything in the env_file to keep production safe.
      ENVIRONMENT: production
      DEV_AUTH_ENABLED: "false"
      # Built here so the in-network DB host ("db") is always correct.
      DATABASE_URL: postgresql+psycopg2://kb_user:${POSTGRES_PASSWORD}@db:5432/knowledge_base
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Cache the downloaded embedding model between restarts.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
